resolver 127.0.0.11 valid=10s ipv6=off;

upstream financeiro_backend {
    zone financeiro_backend 64k;
    server web-financeiro:9501 resolve;
}

upstream mkt_backend {
    zone mkt_backend 64k;
    server web-mkt:3000 resolve;
}

upstream academico_backend {
    zone academico_backend 64k;
    server web-academico:8080 resolve;
}

server {
    listen 80;

    location /financeiro/ {
        proxy_pass http://financeiro_backend/;
    }

    location /mkt/ {
        proxy_pass http://mkt_backend/;
    }

    location /academico/ {
        proxy_pass http://academico_backend/;
    }
}
