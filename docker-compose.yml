services:
  front:
    build: ./front-end
    ports: 
      - "127.0.0.1:4200:4200"
    environment:
      API_URL: "http://web-mkt:3000"

  web-mkt:
    image: node:16
    volumes:
      - ./mkt-node:/app
      - type: bind
        source: ./mkt-node.sh
        target: /app/entrypoint.sh
    working_dir: /app
    command: sh ./entrypoint.sh
    environment: 
      SERVER_PORT: 3000
      MONGO_URL: "mongodb://mkt-usuario:mkt-senha@mongo-mkt:27017/mkt?authSource=admin"
      RABBITMQ_HOST: 'rabbitmq'
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - rabbitmq
      - mongo-mkt

  mongo-mkt:
    image: mongo
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mkt-usuario
      MONGO_INITDB_ROOT_PASSWORD: mkt-senha
      MONGO_INITDB_DATABASE: mkt

  rabbitmq:
    image: rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"

  web-financeiro:
    build: ./financeiro-php
    command: sh ./entrypoint.sh
    ports:
      - "127.0.0.1:9501:9501"
    volumes:
      - ./financeiro-php:/app
      - type: bind
        source: ./financeiro-php.sh
        target: /app/entrypoint.sh
    working_dir: /app
    depends_on:
      - rabbitmq

  api-gateway:
    image: nginx
    volumes:
      - ./servicos-nginx:/etc/nginx/conf.d
    restart: always
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - web-academico
      - web-financeiro
      - web-mkt

  consumer-academico:
    build: ./academico-php
    volumes:
      - ./academico-php:/app
      - type: bind
        source: ./academico-php.sh
        target: /app/entrypoint.sh
    working_dir: /app
    command: sh ./entrypoint.sh
    depends_on:
      - rabbitmq
      - postgre-academico
    environment:
      DB_DSN: pgsql:host=postgre-academico;dbname=academico;port=5432
      DB_USERNAME: usuario_academico
      DB_PASSWORD: senhapg
      RABBITMQ_HOST: 'rabbitmq'
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      MAIL_FROM: "${MAIL_FROM:-no-reply@example.invalid}"

  postgre-academico:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: senhapg
      POSTGRES_USER: usuario_academico
      POSTGRES_DB: academico

  web-academico:
    build: ./academico-php-web
    environment:
      JWT_KEY: chave-jwt
      DB_CONNECTION: pgsql
      DB_HOST: postgre-academico
      DB_DATABASE: academico
      DB_USERNAME: usuario_academico
      DB_PASSWORD: senhapg
      APP_KEY: c08cbbfd6eefc83ac6d23c4c791277e4
      APP_URL: http://web-academico:8080
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ./academico-php-web/:/app
      - type: bind
        source: ./academico-php-web.sh
        target: /app/entrypoint.sh
    working_dir: /app
    command: sh ./entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgre-academico

volumes:
  mongo_data:
  mongo_config:
  rabbitmq_data:
  postgres_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${JORNADA_DOCKER_SUBNET:-10.254.240.0/24}
