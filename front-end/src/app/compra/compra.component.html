<header class="container">
    <span class="brand">Digital Product Sales Journey</span>
</header>
<div class="grid container">
    <div class="col">
        <mat-stepper linear #stepper>
            <mat-step label="Dados pessoais" [stepControl]="dadosPessoaisFormGroup">
              <app-dados-pessoais [formGroup]="dadosPessoaisFormGroup" [stepper]="stepper"></app-dados-pessoais>
            </mat-step>
            <mat-step label="Detalhes de pagamento" [stepControl]="detalhesPagamentoFormGroup">
              <app-detalhes-pagamento [formGroup]="detalhesPagamentoFormGroup" [stepper]="stepper" [email]="dadosPessoaisFormGroup?.get('email')?.value"></app-detalhes-pagamento>
            </mat-step>
            <mat-step label="Fim">
              <app-fim></app-fim>
            </mat-step>
        </mat-stepper>
    </div>

    <div class="col">
      <mat-card>
        <mat-card-title-group>
          <mat-card-title>
            Informações da sua compra
          </mat-card-title>
          <mat-card-subtitle>
            Jornada de Venda Digital
          </mat-card-subtitle>
        </mat-card-title-group>
        <mat-card-content>
          <p>Valor ilustrativo do plano <b>R$ 123,45</b></p>

          <p>Conteúdos demonstrativos da jornada</p>
          <mat-list>
            <mat-list-item>- Explore os módulos disponíveis</mat-list-item>
            <mat-list-item>- Acompanhe os conteúdos concluídos</mat-list-item>
            <mat-list-item>- Acesse com o e-mail da matrícula</mat-list-item>
           </mat-list>
        </mat-card-content>
      </mat-card>
    </div>
</div>
